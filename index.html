<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>İkinci Beyin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEBE1; --paper-alt:#E6E0D0; --surface:#FFFFFF;
    --ink:#21261F; --ink-soft:#5B5B4E; --border:#D9D2BE; --danger:#A13D2C;
    --c-inbox:#4A4A40; --c-projects:#8B4A2B; --c-areas:#3B5B52;
    --c-resources:#3E5C76; --c-archive:#8A8375; --c-daily:#96731A; --c-ai:#5B4B8A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{ background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
  #app{ display:flex; flex-direction:column; height:100vh; max-width:600px; margin:0 auto; background:var(--paper); position:relative; }
  .view{ flex:1; display:flex; flex-direction:column; overflow:hidden; }

  .bottom-nav{ display:flex; border-top:1px solid var(--border); background:var(--surface); flex-shrink:0; }
  .bottom-nav button{ flex:1; background:none; border:none; padding:11px 6px 9px; font-family:'Inter',sans-serif; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .bottom-nav button .glyph{ width:18px;height:18px; border-radius:5px; border:1.6px solid var(--ink-soft); }
  .bottom-nav button.active{ color:var(--ink); }
  .bottom-nav button.active .glyph{ border-color:var(--ink); background:var(--ink); }
  .bottom-nav button:nth-child(2).active .glyph{ background:var(--c-ai); border-color:var(--c-ai); }

  header{ padding:18px 16px 10px; flex-shrink:0; }
  header h1{ font-family:'Lora',serif; font-weight:600; font-size:22px; margin:0 0 12px; letter-spacing:-0.01em; }
  .search-row{ display:flex; gap:8px; }
  .search-box{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 12px; font-family:'Inter',sans-serif; font-size:14px; color:var(--ink); }
  .search-box:focus{outline:none;border-color:var(--ink-soft);}

  .tabs{ display:flex; gap:6px; overflow-x:auto; padding:12px 16px 10px; flex-shrink:0; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{ flex-shrink:0; padding:7px 13px; border-radius:8px; font-size:13px; font-weight:500; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px; }
  .tab .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .tab.active{ background:var(--tab-color, var(--ink)); color:#fff; border-color:transparent; }
  .tab.active .dot{background:#fff;}

  .list{ flex:1; overflow-y:auto; padding:4px 16px 90px; position:relative; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty-state .glyph-txt{ font-family:'Lora',serif; font-size:15px; font-style:italic; display:block; margin-bottom:6px; }
  .empty-state .sub{font-size:13px;}

  .daily-capture{ display:flex; gap:8px; margin-bottom:14px; }
  .daily-capture input{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px; font-family:'Inter',sans-serif; }
  .daily-capture input:focus{outline:none;border-color:var(--c-daily);}
  .daily-capture button{ background:var(--c-daily); color:#fff; border:none; border-radius:10px; padding:0 16px; font-size:13px; font-weight:600; cursor:pointer; }

  .card{ background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--card-color, var(--ink)); border-radius:8px; padding:12px 14px; margin-bottom:9px; cursor:pointer; }
  .card:active{transform:scale(0.98);}
  .card-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .card h3{ font-family:'Lora',serif; font-weight:600; font-size:15px; margin:0; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .date{ font-size:11px; color:var(--ink-soft); flex-shrink:0; }
  .card p{ margin:5px 0 0; font-size:13px; color:var(--ink-soft); line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .tags{ margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .card .tag{ font-size:11px; color:var(--ink-soft); background:var(--paper-alt); padding:2px 8px; border-radius:20px; }

  .fab{ position:absolute; right:20px; bottom:24px; width:52px; height:52px; border-radius:50%; background:var(--ink); color:#fff; border:none; font-size:26px; line-height:1; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,0.25); display:flex; align-items:center; justify-content:center; }

  .overlay{ position:absolute; inset:0; bottom:56px; background:var(--paper); display:flex; flex-direction:column; transform:translateY(100%); transition:transform .22s ease; z-index:10; }
  .overlay.open{transform:translateY(0);}
  .overlay-top{ display:flex; align-items:center; justify-content:space-between; padding:14px 12px; flex-shrink:0; border-bottom:1px solid var(--border); }
  .icon-btn{ background:none; border:none; font-size:14px; font-weight:600; color:var(--ink-soft); padding:6px 10px; cursor:pointer; }
  .icon-btn.save{color:var(--ink);}
  .icon-btn.delete{color:var(--danger);}
  .overlay-body{ flex:1; overflow-y:auto; padding:16px; }
  .overlay input[type=text]{ width:100%; border:none; background:none; font-family:'Lora',serif; font-size:21px; font-weight:600; color:var(--ink); padding:0 0 12px; }
  .overlay input[type=text]:focus{outline:none;}
  .folder-select{ display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; scrollbar-width:none; }
  .folder-select::-webkit-scrollbar{display:none;}
  .folder-select .opt{ flex-shrink:0; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:500; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); cursor:pointer; }
  .folder-select .opt.active{ background:var(--opt-color, var(--ink)); color:#fff; border-color:transparent; }
  .tags-input{ width:100%; border:1px solid var(--border); border-radius:8px; background:var(--surface); padding:8px 10px; font-size:13px; font-family:'Inter',sans-serif; margin-bottom:14px; }
  .tags-input:focus{outline:none;border-color:var(--ink-soft);}
  .body-input{ width:100%; min-height:36vh; border:none; background:none; resize:vertical; font-family:'Inter',sans-serif; font-size:15px; line-height:1.6; color:var(--ink); }
  .body-input:focus{outline:none;}

  .chat-header{ padding:16px 16px 4px; flex-shrink:0; }
  .chat-header h1{ font-family:'Lora',serif; font-weight:600; font-size:22px; margin:0; }
  .chat-header p{ font-size:12.5px; color:var(--ink-soft); margin:4px 0 0; }
  .chat-messages{ flex:1; overflow-y:auto; padding:14px 16px; }
  .msg-row{ display:flex; margin-bottom:14px; }
  .msg-row.user{ justify-content:flex-end; }
  .bubble{ max-width:82%; padding:10px 13px; border-radius:14px; font-size:14.5px; line-height:1.55; white-space:pre-wrap; }
  .msg-row.user .bubble{ background:var(--c-ai); color:#fff; border-bottom-right-radius:4px; }
  .msg-row.assistant .bubble{ background:var(--surface); border:1px solid var(--border); color:var(--ink); border-bottom-left-radius:4px; }
  .used-notes{ font-size:11px; color:var(--ink-soft); margin:5px 2px 0; max-width:82%; }
  .used-notes b{ color:var(--c-ai); font-weight:600; }
  .chat-empty{ text-align:center; padding:50px 24px; color:var(--ink-soft); }
  .chat-empty .glyph-txt{ font-family:'Lora',serif; font-style:italic; font-size:15px; display:block; margin-bottom:6px; }
  .chat-input-row{ display:flex; gap:8px; padding:10px 16px 14px; flex-shrink:0; border-top:1px solid var(--border); background:var(--paper); }
  .chat-input-row textarea{ flex:1; resize:none; border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-family:'Inter',sans-serif; font-size:14.5px; line-height:1.4; max-height:100px; color:var(--ink); background:var(--surface); }
  .chat-input-row textarea:focus{outline:none;border-color:var(--c-ai);}
  .chat-send{ background:var(--c-ai); color:#fff; border:none; border-radius:12px; width:44px; flex-shrink:0; font-size:16px; cursor:pointer; }
  .chat-send:disabled{ opacity:0.5; }
  .thinking{ font-size:13px; color:var(--ink-soft); font-style:italic; padding:2px 2px 14px; }

  .settings-body{ flex:1; overflow-y:auto; padding:18px 16px 40px; }
  .settings-body h1{ font-family:'Lora',serif; font-size:22px; font-weight:600; margin:0 0 18px; }
  .settings-card{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
  .settings-card h3{ font-size:14px; margin:0 0 6px; font-family:'Lora',serif; }
  .settings-card p{ font-size:13px; color:var(--ink-soft); line-height:1.6; margin:0 0 10px; }
  .settings-card p.warn{ color:var(--danger); }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .settings-row input[type=range]{ flex:1; accent-color:var(--c-ai); }
  .settings-count{ font-size:13px; font-weight:600; color:var(--c-ai); width:24px; text-align:right; }
  .settings-input, .settings-select{ width:100%; border:1px solid var(--border); border-radius:8px; background:var(--paper); padding:10px 12px; font-size:14px; font-family:'Inter',sans-serif; color:var(--ink); margin-bottom:8px; }
  .settings-input:focus, .settings-select:focus{ outline:none; border-color:var(--c-ai); }
  .save-key-btn{ background:var(--c-ai); color:#fff; border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  .status-pill{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; }
  .status-pill.ok{ color:var(--c-areas); }
  .status-pill.off{ color:var(--danger); }
  .status-pill .dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }

  .loading{ display:flex; align-items:center; justify-content:center; height:100%; color:var(--ink-soft); font-size:14px; }
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="loading">Yükleniyor…</div>
</div>

<script>
const FOLDERS = [
  {id:'inbox',     label:'Gelen Kutusu', color:'var(--c-inbox)'},
  {id:'projects',  label:'Projeler',     color:'var(--c-projects)'},
  {id:'areas',     label:'Alanlar',      color:'var(--c-areas)'},
  {id:'resources', label:'Kaynaklar',    color:'var(--c-resources)'},
  {id:'archive',   label:'Arşiv',        color:'var(--c-archive)'},
  {id:'daily',     label:'Günlük',       color:'var(--c-daily)'},
];
const DATA_KEY = 'secondbrain-data';
const KEY_KEY = 'secondbrain-api-key';
const MODELS = [
  {id:'claude-sonnet-5', label:'Claude Sonnet 5 (önerilen)'},
  {id:'claude-opus-5',   label:'Claude Opus 5 (en güçlü, daha yavaş/pahalı)'},
  {id:'claude-haiku-4-5-20251001', label:'Claude Haiku 4.5 (en hızlı/ucuz)'},
];

let state = { notes: [], chat: [], settings: { contextCount: 6, model: 'claude-sonnet-5' } };
let currentView = 'notebook';
let currentFolder = 'inbox';
let currentSearch = '';
let draft = null;
let chatBusy = false;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric'}); }
function folderMeta(id){ return FOLDERS.find(f=>f.id===id) || FOLDERS[0]; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatDate(ts){ if(!ts) return ''; return new Date(ts).toLocaleDateString('tr-TR', {day:'numeric', month:'short'}); }

function loadState(){
  try{
    const raw = localStorage.getItem(DATA_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = {
        notes: Array.isArray(parsed.notes) ? parsed.notes : [],
        chat: Array.isArray(parsed.chat) ? parsed.chat : [],
        settings: Object.assign({ contextCount:6, model:'claude-sonnet-5' }, parsed.settings || {}),
      };
    }
  }catch(e){ /* start fresh */ }
}
function saveState(){
  try{ localStorage.setItem(DATA_KEY, JSON.stringify(state)); }
  catch(e){ console.error('Kaydetme hatası', e); }
}
function getApiKey(){ return localStorage.getItem(KEY_KEY) || ''; }
function setApiKey(k){ localStorage.setItem(KEY_KEY, k); }

// ---------- Relevance search ----------
function tokenize(text){ return (text||'').toLowerCase().match(/[\p{L}\p{N}]+/gu) || []; }
function findRelevantNotes(query, limit){
  const qTokens = [...new Set(tokenize(query).filter(t=>t.length>=3))];
  if(qTokens.length===0) return [];
  const scored = state.notes.map(n=>{
    const bodyTokens = tokenize(n.body), titleTokens = tokenize(n.title), tagTokens = tokenize((n.tags||[]).join(' '));
    let score = 0;
    qTokens.forEach(qt=>{
      if(titleTokens.includes(qt)) score += 3;
      if(tagTokens.includes(qt)) score += 3;
      if(bodyTokens.includes(qt)) score += 1;
    });
    return {note:n, score};
  }).filter(s=>s.score>0);
  scored.sort((a,b)=> b.score - a.score);
  return scored.slice(0, limit).map(s=>s.note);
}

// ---------- Claude API (direct browser call, BYOK) ----------
async function callClaudeChat(systemPrompt, messages){
  const apiKey = getApiKey();
  if(!apiKey) throw new Error('no-key');
  const model = (state.settings && state.settings.model) || 'claude-sonnet-5';
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({ model, max_tokens: 1000, system: systemPrompt, messages })
  });
  if(!response.ok){
    const errText = await response.text().catch(()=> '');
    throw new Error('api-error:' + response.status + ':' + errText);
  }
  const data = await response.json();
  return (data.content || []).map(b => b.text || "").join("\n");
}

function buildSystemPrompt(relevantNotes){
  if(relevantNotes.length === 0){
    return `Sen kullanıcının kişisel not defteri ("İkinci Beyin") üzerinde çalışan bir sohbet asistanısın. Bu soru için kullanıcının notlarında ilgili bir kayıt bulunamadı. Bunu kullanıcıya nazikçe belirt, istersen genel bilginle kısaca yardımcı ol. Türkçe yanıt ver.`;
  }
  const notesBlock = relevantNotes.map(n =>
    `[${folderMeta(n.folder).label}] ${n.title}\n${n.body}${n.tags && n.tags.length ? '\nEtiketler: ' + n.tags.join(', ') : ''}`
  ).join('\n\n---\n\n');
  return `Sen kullanıcının kişisel not defteri ("İkinci Beyin") üzerinde çalışan bir sohbet asistanısın. Kullanıcının sorusuyla ilgili bulunan notlar aşağıda. Bu notları bağlam olarak kullanarak Türkçe yanıt ver. Notlarda olmayan bir şeyi soruyorsa bunu belirt, gerekirse genel bilginle destekle ama notlardaki bilgiyle karıştırma.

İLGİLİ NOTLAR:
${notesBlock}`;
}

// ---------- Root render ----------
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="view" id="viewRoot"></div>
    <div class="bottom-nav" id="bottomNav">
      <button data-view="notebook" class="${currentView==='notebook'?'active':''}"><span class="glyph"></span>Defter</button>
      <button data-view="chat" class="${currentView==='chat'?'active':''}"><span class="glyph"></span>Sohbet</button>
      <button data-view="settings" class="${currentView==='settings'?'active':''}"><span class="glyph"></span>Ayarlar</button>
    </div>
  `;
  document.getElementById('bottomNav').addEventListener('click', e=>{
    const b = e.target.closest('button');
    if(!b) return;
    currentView = b.dataset.view;
    render();
  });
  if(currentView === 'notebook') renderNotebook();
  else if(currentView === 'chat') renderChat();
  else renderSettings();
}

// ================= NOTEBOOK =================
function renderNotebook(){
  const root = document.getElementById('viewRoot');
  root.innerHTML = `
    <header>
      <h1>İkinci Beyin</h1>
      <div class="search-row"><input class="search-box" id="searchBox" type="text" placeholder="Notlarda ara…" value="${escapeHtml(currentSearch)}"></div>
    </header>
    <div class="tabs" id="tabs">
      ${FOLDERS.map(f => `
        <div class="tab ${currentFolder===f.id?'active':''}" style="--tab-color:${f.color}" data-folder="${f.id}">
          <span class="dot" style="background:${f.color}"></span>${f.label}
        </div>`).join('')}
    </div>
    <div class="list" id="list"><div class="overlay" id="editOverlay"></div></div>
    <button class="fab" id="fabNew">+</button>
  `;
  renderList();
  renderEditOverlay();
  document.getElementById('searchBox').addEventListener('input', e=>{ currentSearch = e.target.value; renderList(); });
  document.getElementById('tabs').addEventListener('click', e=>{
    const t = e.target.closest('.tab'); if(!t) return;
    currentFolder = t.dataset.folder; currentSearch = ''; renderNotebook();
  });
  document.getElementById('fabNew').addEventListener('click', ()=> openEditOverlay('new'));
}

function getFilteredNotes(){
  let list = state.notes.filter(n => n.folder === currentFolder);
  if(currentSearch.trim()){
    const q = currentSearch.trim().toLowerCase();
    list = list.filter(n => (n.title||'').toLowerCase().includes(q) || (n.body||'').toLowerCase().includes(q) || (n.tags||[]).some(t=>t.toLowerCase().includes(q)));
  }
  return list.sort((a,b)=> (b.updated||0) - (a.updated||0));
}

function renderList(){
  const listEl = document.getElementById('list');
  if(!listEl) return;
  const meta = folderMeta(currentFolder);
  let html = '';
  if(currentFolder === 'daily'){
    html += `<div class="daily-capture"><input type="text" id="dailyInput" placeholder="${todayStr()} için hızlı not…"><button id="dailyAdd">Ekle</button></div>`;
  }
  const notes = getFilteredNotes();
  if(notes.length === 0){
    html += `<div class="empty-state"><span class="glyph-txt">Burası henüz boş</span><span class="sub">${currentFolder==='daily' ? 'Yukarıdan hızlı bir not ekleyebilirsin.' : '+ ile yeni bir not oluştur.'}</span></div>`;
  } else {
    html += notes.map(n => `
      <div class="card" style="--card-color:${meta.color}" data-id="${n.id}">
        <div class="card-top"><h3>${escapeHtml(n.title || 'Başlıksız')}</h3><span class="date">${formatDate(n.updated)}</span></div>
        ${n.body ? `<p>${escapeHtml(n.body)}</p>` : ''}
        ${(n.tags && n.tags.length) ? `<div class="tags">${n.tags.map(t=>`<span class="tag">#${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      </div>`).join('');
  }
  html += `<div class="overlay" id="editOverlay"></div>`;
  listEl.innerHTML = html;
  listEl.querySelectorAll('.card').forEach(c=> c.addEventListener('click', ()=> openEditOverlay(c.dataset.id)));
  renderEditOverlay();

  const dailyAdd = document.getElementById('dailyAdd');
  if(dailyAdd){
    const input = document.getElementById('dailyInput');
    const submit = ()=>{
      const val = input.value.trim(); if(!val) return;
      const now = Date.now();
      state.notes.push({ id: uid(), title: todayStr(), body: val, folder: 'daily', tags: [], created: now, updated: now });
      saveState(); input.value=''; renderList();
    };
    dailyAdd.addEventListener('click', submit);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  }
}

function openEditOverlay(id){
  if(id === 'new'){
    draft = { id: uid(), title:'', body:'', folder: currentFolder==='daily' ? 'inbox' : currentFolder, tags:[], created: Date.now(), updated: Date.now(), isNew:true };
  } else {
    const existing = state.notes.find(n=>n.id===id);
    if(!existing) return;
    draft = { ...existing, tags:[...(existing.tags||[])] };
  }
  renderEditOverlay();
  document.getElementById('editOverlay').classList.add('open');
}
function closeEditOverlay(){
  const el = document.getElementById('editOverlay'); if(el) el.classList.remove('open');
  draft = null; setTimeout(renderList, 180);
}
function renderEditOverlay(){
  const el = document.getElementById('editOverlay'); if(!el) return;
  if(!draft){ el.innerHTML=''; return; }
  el.innerHTML = `
    <div class="overlay-top">
      <button class="icon-btn" id="editClose">İptal</button>
      <div>${!draft.isNew ? `<button class="icon-btn delete" id="editDelete">Sil</button>` : ''}<button class="icon-btn save" id="editSave">Kaydet</button></div>
    </div>
    <div class="overlay-body">
      <input type="text" id="editTitle" placeholder="Başlık" value="${escapeHtml(draft.title)}">
      <div class="folder-select" id="editFolderSelect">
        ${FOLDERS.filter(f=>f.id!=='daily' || draft.folder==='daily').map(f => `<div class="opt ${draft.folder===f.id?'active':''}" style="--opt-color:${f.color}" data-folder="${f.id}">${f.label}</div>`).join('')}
      </div>
      <input class="tags-input" type="text" id="editTags" placeholder="etiketler (virgülle ayır)" value="${escapeHtml((draft.tags||[]).join(', '))}">
      <textarea class="body-input" id="editBody" placeholder="Aklındakileri yaz…">${escapeHtml(draft.body)}</textarea>
    </div>`;
  document.getElementById('editClose').addEventListener('click', closeEditOverlay);
  document.getElementById('editTitle').addEventListener('input', e=> draft.title = e.target.value);
  document.getElementById('editBody').addEventListener('input', e=> draft.body = e.target.value);
  document.getElementById('editTags').addEventListener('input', e=>{ draft.tags = e.target.value.split(',').map(t=>t.trim()).filter(Boolean); });
  document.getElementById('editFolderSelect').addEventListener('click', e=>{
    const opt = e.target.closest('.opt'); if(!opt) return;
    draft.folder = opt.dataset.folder; renderEditOverlay();
  });
  document.getElementById('editSave').addEventListener('click', ()=>{
    if(!draft.title.trim() && !draft.body.trim()){ closeEditOverlay(); return; }
    if(!draft.title.trim()) draft.title = draft.body.slice(0,40);
    draft.updated = Date.now();
    const idx = state.notes.findIndex(n=>n.id===draft.id);
    const {isNew, ...clean} = draft;
    if(idx>=0) state.notes[idx] = clean; else state.notes.push(clean);
    saveState(); currentFolder = clean.folder; closeEditOverlay();
    setTimeout(renderNotebook, 190);
  });
  const delBtn = document.getElementById('editDelete');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    state.notes = state.notes.filter(n=>n.id!==draft.id);
    saveState(); closeEditOverlay();
  });
}

// ================= CHAT =================
function renderChat(){
  const root = document.getElementById('viewRoot');
  const hasKey = !!getApiKey();
  root.innerHTML = `
    <div class="chat-header">
      <h1>Sohbet</h1>
      <p>${hasKey ? 'Sorduğun her şeyde defterindeki ilgili notlar otomatik bulunup bağlam olarak kullanılır.' : 'Sohbeti kullanmak için önce Ayarlar\\'dan API anahtarını gir.'}</p>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <textarea id="chatInput" rows="1" placeholder="${hasKey ? 'Notlarınla ilgili bir şey sor…' : 'Önce Ayarlar\\'dan API anahtarı gir'}" ${hasKey?'':'disabled'}></textarea>
      <button class="chat-send" id="chatSend" ${hasKey?'':'disabled'}>↑</button>
    </div>`;
  renderChatMessages();
  const input = document.getElementById('chatInput');
  const send = document.getElementById('chatSend');
  const doSend = ()=> sendChatMessage(input.value);
  send.addEventListener('click', doSend);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSend(); } });
}

function renderChatMessages(){
  const el = document.getElementById('chatMessages'); if(!el) return;
  if(state.chat.length===0 && !chatBusy){
    el.innerHTML = `<div class="chat-empty"><span class="glyph-txt">Henüz konuşmadık</span><span class="sub">Notlarına bir şey sor, örneğin "geçen ay X projesiyle ilgili ne yazmıştım?"</span></div>`;
    return;
  }
  el.innerHTML = state.chat.map(m => `
    <div class="msg-row ${m.role}"><div class="bubble">${escapeHtml(m.content)}</div></div>
    ${m.role==='assistant' && m.usedNotes && m.usedNotes.length ? `<div class="used-notes"><b>Kaynak notlar:</b> ${m.usedNotes.map(escapeHtml).join(', ')}</div>` : ''}
  `).join('') + (chatBusy ? `<div class="thinking">AI notlarına bakıyor…</div>` : '');
  el.scrollTop = el.scrollHeight;
}

async function sendChatMessage(text){
  text = (text||'').trim();
  if(!text || chatBusy) return;
  const input = document.getElementById('chatInput'); if(input) input.value = '';
  state.chat.push({ role:'user', content:text, ts:Date.now() });
  chatBusy = true; renderChatMessages(); saveState();

  try{
    const contextCount = (state.settings && state.settings.contextCount) || 6;
    const relevant = findRelevantNotes(text, contextCount);
    const systemPrompt = buildSystemPrompt(relevant);
    const apiMessages = state.chat.map(m => ({ role:m.role, content:m.content }));
    const reply = await callClaudeChat(systemPrompt, apiMessages);
    state.chat.push({ role:'assistant', content: reply || 'Bir yanıt alınamadı, tekrar dener misin?', ts: Date.now(), usedNotes: relevant.map(n=>n.title || 'Başlıksız') });
  }catch(e){
    let msg = 'AI şu an yanıt veremedi, tekrar dener misin?';
    if(String(e.message).includes('no-key')) msg = 'API anahtarı girilmemiş. Ayarlar sekmesinden ekleyebilirsin.';
    else if(String(e.message).includes('401')) msg = 'API anahtarı geçersiz görünüyor. Ayarlar\\'dan kontrol eder misin?';
    state.chat.push({ role:'assistant', content: msg, ts:Date.now() });
  }
  chatBusy = false; saveState(); renderChatMessages();
}

// ================= SETTINGS =================
function renderSettings(){
  const root = document.getElementById('viewRoot');
  const count = (state.settings && state.settings.contextCount) || 6;
  const model = (state.settings && state.settings.model) || 'claude-sonnet-5';
  const hasKey = !!getApiKey();
  root.innerHTML = `
    <div class="settings-body">
      <h1>Ayarlar</h1>

      <div class="settings-card">
        <h3>Anthropic API Anahtarı</h3>
        <p>Anahtarını <b>console.anthropic.com</b> üzerinden alabilirsin. Yalnızca bu tarayıcıda, cihazında saklanır — hiçbir sunucuya gönderilmez.</p>
        <p class="warn">Bu siteyi başkalarıyla paylaşırsan, kendi anahtarlarını kendi tarayıcılarına girmeleri gerekir — senin anahtarın onlarla paylaşılmaz. Yine de anahtarını kimseyle paylaşma.</p>
        <input class="settings-input" type="password" id="apiKeyInput" placeholder="sk-ant-..." value="${escapeHtml(getApiKey())}">
        <button class="save-key-btn" id="saveKeyBtn">Kaydet</button>
        <div style="margin-top:10px;">
          <span class="status-pill ${hasKey?'ok':'off'}"><span class="dot"></span>${hasKey ? 'Anahtar kayıtlı' : 'Anahtar girilmedi'}</span>
        </div>
      </div>

      <div class="settings-card">
        <h3>Model</h3>
        <select class="settings-select" id="modelSelect">
          ${MODELS.map(m => `<option value="${m.id}" ${m.id===model?'selected':''}>${m.label}</option>`).join('')}
        </select>
      </div>

      <div class="settings-card">
        <h3>Bağlam boyutu</h3>
        <p>Her soruda notlarından en fazla kaç tanesi AI'a bağlam olarak gönderilsin?</p>
        <div class="settings-row"><input type="range" id="contextRange" min="2" max="12" value="${count}"><span class="settings-count" id="contextCountLabel">${count}</span></div>
      </div>

      <div class="settings-card">
        <h3>Not defteri</h3>
        <p>Defter kısmı tamamen elle yönetilir, AI oraya erişmez ya da yazmaz. Sohbet ekranı sadece soru sorduğunda ilgili notları okur.</p>
      </div>
    </div>`;

  document.getElementById('saveKeyBtn').addEventListener('click', ()=>{
    setApiKey(document.getElementById('apiKeyInput').value.trim());
    renderSettings();
  });
  document.getElementById('modelSelect').addEventListener('change', e=>{
    state.settings.model = e.target.value; saveState();
  });
  const range = document.getElementById('contextRange');
  const label = document.getElementById('contextCountLabel');
  range.addEventListener('input', e=>{
    label.textContent = e.target.value;
    state.settings.contextCount = parseInt(e.target.value, 10);
    saveState();
  });
}

(function init(){
  loadState();
  render();
})();
</script>
</body>
</html>
